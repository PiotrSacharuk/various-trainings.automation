name: order-flow CI pipeline

permissions:
  contents: write
  packages: write
  id-token: write

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

defaults:
  run:
    working-directory: .

env:
  FLASK_PORT: 5000
  PYTHON_VERSION: '3.12'

jobs:
  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-poetry-

      - name: Install dependencies
        run: poetry install

      - name: Run Security Scan (bandit)
        run: |
          # Scan only project source to avoid scanning virtualenv and site-packages
          poetry run bandit -r src -ll

      - name: Run Linters (Black/Isort/Flake8)
        run: |
          poetry run black --check src --exclude=".venv"
          poetry run isort --check-only src --skip=".venv"
          poetry run flake8 src --exclude=".venv"

  build-and-scan:
    needs: code-quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build Docker image
        run: |
          docker build -t order-flow:${{ github.sha }} .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: order-flow:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: 'true'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Install Syft
        run: |
          VERSION="v1.36.0"
          FILE="syft_${VERSION#v}_linux_amd64.tar.gz"

          for i in 1 2 3; do
            curl -sSfL -o syft.tgz "https://github.com/anchore/syft/releases/download/${VERSION}/${FILE}" && break
            echo "Retry $i..."
            sleep 3
          done

          tar -xzf syft.tgz
          sudo install syft /usr/local/bin/syft
          syft --version

      - name: Generate SBOM
        run: |
          syft order-flow:${{ github.sha }} -o json > sbom.json
          echo "SBOM generated successfully"
          ls -la sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE_REPO (lowercase owner)
        run: |
          OWNER="${{ github.repository_owner }}"
          IMAGE_REPO="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/order-flow"
          echo "IMAGE_REPO=$IMAGE_REPO" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pypoetry
            .venv
          key: ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-poetry-

      - name: Install dependencies
        run: poetry install

      - name: Determine version using conventional commits
        id: version
        run: poetry run python src/version_bumper.py

      - name: Push Docker image to GHCR with semantic version
        if: github.event_name == 'push' || github.actor != 'dependabot[bot]'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          docker tag order-flow:${{ github.sha }} $IMAGE_REPO:${{ github.sha }}
          docker tag order-flow:${{ github.sha }} $IMAGE_REPO:${VERSION}
          docker tag order-flow:${{ github.sha }} $IMAGE_REPO:latest

          docker push $IMAGE_REPO:${{ github.sha }}
          docker push $IMAGE_REPO:${VERSION}
          docker push $IMAGE_REPO:latest

          echo "Images pushed:"
          echo "  - $IMAGE_REPO:${{ github.sha }}"
          echo "  - $IMAGE_REPO:${VERSION}"
          echo "  - $IMAGE_REPO:latest"

      - name: Create and push Git tag
        if: github.event_name == 'push'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists!"
            exit 0
          fi

          git tag -a "v${VERSION}" -m "Release v${VERSION} - Image: $IMAGE_REPO:${VERSION}"
          git push origin "v${VERSION}"
          echo "Tag created and pushed: v${VERSION}"

  dast-scan:
    needs: build-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE_REPO
        run: |
          OWNER="${{ github.repository_owner }}"
          IMAGE_REPO="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/order-flow"
          echo "IMAGE_REPO=$IMAGE_REPO" >> $GITHUB_ENV

      - name: Pull Docker image
        run: docker pull $IMAGE_REPO:${{ github.sha }}

      - name: Start application container
        run: |
          docker run -d --name order-flow-container -p ${{ env.FLASK_PORT }}:${{ env.FLASK_PORT }} -e FLASK_HOST=0.0.0.0 -e FLASK_PORT=${{ env.FLASK_PORT }} $IMAGE_REPO:${{ github.sha }}

          echo "Waiting for application to start..."
          for i in {1..10}; do
            if curl -s http://localhost:${{ env.FLASK_PORT }}/health > /dev/null; then
              echo "Application is up!"
              exit 0
            fi
            echo "Waiting..."
            sleep 3
          done

          echo "Application failed to start within timeout"
          docker logs order-flow-container
          exit 1

      - name: Run OWASP ZAP DAST Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://localhost:${{ env.FLASK_PORT }}'
          rules_file_name: '.zap/rules.tsv'

      - name: Stop application container
        if: always()
        run: docker stop order-flow-container || true

  generate-release-notes:
    needs: dast-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: "--output CHANGELOG.md --verbose"

      - name: Upload changelog as artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  gitops-update:
    needs: [build-and-scan, generate-release-notes]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: PiotrSacharuk/various_trainings.gitops
          token: ${{ secrets.GITHUB_TOKEN }}
          path: gitops

      - name: Update Helm values with new image version
        working-directory: gitops/orderflow
        run: |
          VERSION="${{ needs.build-and-scan.outputs.version }}"

          echo "Updating values.yaml with version: $VERSION"

          # Update image tag
          sed -i "s/tag: \".*\"/tag: \"$VERSION\"/" values.yaml
          sed -i "s/tag: \".*\"/tag: \"$VERSION\"/" overlays/staging/values.yaml

          echo "Changes:"
          git diff values.yaml

      - name: Commit and push to GitOps repo
        working-directory: gitops
        run: |
          VERSION="${{ needs.build-and-scan.outputs.version }}"

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git add orderflow/values.yaml orderflow/overlays/staging/values.yaml
          git commit -m "chore: Update order-flow to version ${VERSION}

          Automated update from CI pipeline
          Image: ghcr.io/piotrsacharuk/order-flow:${VERSION}
          Trigger: ${{ github.sha }}"

          git push origin master

          echo "GitOps repo updated!"
