name: order-flow CI pipeline

permissions:
  contents: read
  packages: write
  id-token: write

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

defaults:
  run:
    working-directory: .

env:
  FLASK_PORT: 5000

jobs:
  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install

      - name: Run Security Scan (bandit)
        run: |
          # Scan only project source to avoid scanning virtualenv and site-packages
          poetry run bandit -r src -ll

      - name: Run Linters (Black/Isort/Flake8)
        run: |
          poetry run black --check src --exclude=".venv"
          poetry run isort --check-only src --skip=".venv"
          poetry run flake8 src --exclude=".venv"

  build-and-scan:
    needs: code-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t order-flow:${{ github.sha }} .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: order-flow:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: 'true'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate SBOM with Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft order-flow:${{ github.sha }} -o json > sbom.json
          echo "SBOM generated successfully"
          ls -la sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Set IMAGE_REPO (lowercase owner)
        run: |
          OWNER="${{ github.repository_owner }}"
          IMAGE_REPO="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/order-flow"
          echo "IMAGE_REPO=$IMAGE_REPO" >> $GITHUB_ENV

      - name: Determine version using conventional commits
        run: |
          python src/version_bumper.py >> $GITHUB_OUTPUT

      - name: Push Docker image to GHCR with semantic version
        run: |
          docker tag order-flow:${{ github.sha }} $IMAGE_REPO:${{ github.sha }}
          docker tag order-flow:${{ github.sha }} $IMAGE_REPO:${{ steps.version.outputs.version }}
          docker tag order-flow:${{ github.sha }} $IMAGE_REPO:latest

          docker push $IMAGE_REPO:${{ github.sha }}
          docker push $IMAGE_REPO:${{ steps.version.outputs.version }}
          docker push $IMAGE_REPO:latest

          echo "Image pushed:"
          echo "  - $IMAGE_REPO:${{ github.sha }}"
          echo "  - $IMAGE_REPO:${{ steps.version.outputs.version }}"
          echo "  - $IMAGE_REPO:latest"

  dast-scan:
    needs: build-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Set IMAGE_REPO
        run: |
          OWNER="${{ github.repository_owner }}"
          IMAGE_REPO="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/order-flow"
          echo "IMAGE_REPO=$IMAGE_REPO" >> $GITHUB_ENV

      - name: Pull Docker image
        run: docker pull $IMAGE_REPO:${{ github.sha }}

      - name: Start application container
        run: |
          docker run -d --name order-flow-container -p ${{ env.FLASK_PORT }}:${{ env.FLASK_PORT }} -e FLASK_HOST=0.0.0.0 -e FLASK_PORT=${{ env.FLASK_PORT }} $IMAGE_REPO:${{ github.sha }}

          echo "Waiting for application to start..."
          for i in {1..10}; do
            if curl -s http://localhost:${{ env.FLASK_PORT }}/health > /dev/null; then
              echo "Application is up!"
              exit 0
            fi
            echo "Waiting..."
            sleep 3
          done

          echo "Application failed to start within timeout"
          docker logs order-flow-container
          exit 1

      - name: Run OWASP ZAP DAST Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://localhost:${{ env.FLASK_PORT }}'
          rules_file_name: '.zap/rules.tsv'

      - name: Stop application container
        if: always()
        run: docker stop order-flow-container || true

  generate-release-notes:
    needs: dast-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          curl -sSfL https://github.com/orhun/git-cliff/releases/download/v0.13.0/git-cliff-0.13.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv git-cliff /usr/local/bin/

      - name: Generate changelog
        run: |
          git-cliff --output CHANGELOG.md
          echo "Changelog generated"
          head -20 CHANGELOG.md

      - name: Upload changelog as artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md
