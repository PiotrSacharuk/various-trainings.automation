name: order-flow CI pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dependencies
        run: poetry install
        working-directory: ./automation
      - name: Run Security Scan (bandit)
        run: |
          # Scan only project source to avoid scanning virtualenv and site-packages
          poetry run bandit -r src -ll
        working-directory: ./automation
      - name: Run Linters (Black/Isort/Flake8)
        run: |
          poetry run black --check src --exclude=".venv"
          poetry run isort --check-only src --skip=".venv"
          poetry run flake8 src --exclude=".venv"
        working-directory: ./automation

  build-and-scan:
    needs: code-quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./automation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t order-flow:${{ github.sha }} .
      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: order-flow:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: 'true'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image to GHCR
        run: |
          docker tag order-flow:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/order-flow:${{ github.sha }}
          docker tag order-flow:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/order-flow:latest
          docker push ghcr.io/${{ github.repository_owner }}/order-flow:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/order-flow:latest
