[project]
name = "order-flow"
version = "0.1.0"
description = ""
authors = [
    {name = "Piotr Sacharuk",email = "piotr.sacharuk@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pre-commit (>=4.5.0,<5.0.0)",
    "detect-secrets (>=1.5.0,<2.0.0)",
    "flask (>=3.1.2,<4.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "prometheus-client (>=0.23.1,<0.24.0)"
]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=25.11.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "bandit (>=1.9.2,<2.0.0)",
    "mypy (>=1.19.0,<2.0.0)"
]
